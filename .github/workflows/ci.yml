name: PayPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run eval suite (offline, mock PayPal)
        run: python eval.py
      - name: CLI smoke test - demo scenarios
        run: python -m paypilot demo
      - name: CLI smoke test - blocked request refuses to pay (exit 2)
        run: |
          set +e
          python -m paypilot shop "buy a luxury watch for $500"
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then echo "expected exit code 2, got $code"; exit 1; fi
